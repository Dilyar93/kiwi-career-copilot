name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: agent_service/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r agent_service/requirements.txt
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m pytest agent_service -q
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
